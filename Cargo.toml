[package]
name = "lantern-cli"
version = "0.1.0"
edition = "2024"
description = "A modern terminal presentation tool for Markdown decks"
license = "MIT"
repository = "https://github.com/stormlightlabs/lantern"
readme = "README.md"
keywords = ["markdown", "slides", "presentations", "terminal", "tui"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/rustfmt.toml",
    "/src/**",
    "/examples/**",
]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25"
owo-colors = "4.2.3"
ratatui = "0.29.0"
ratatui-image = "8.0.2"
pulldown-cmark = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
syntect = "5"
terminal-colorsaurus = "1.0.1"
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[lints.clippy]
bool_comparison = "deny"
duplicate_mod = "deny"
inconsistent_struct_constructor = "deny"
invalid_regex = "deny"
mem_forget = "deny"
mixed_case_hex_literals = "deny"
suspicious_arithmetic_impl = "deny"
uninit_assumed_init = "deny"
suspicious_else_formatting = "deny"
suspicious_op_assign_impl = "deny"
suspicious_to_owned = "deny"
cmp_owned = "deny"
cmp_null = "deny"
manual_map = "deny"

too_many_arguments = "warn"
cyclomatic_complexity = "warn"
large_enum_variant = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_cast = "warn"
inefficient_to_string = "warn"
or_fun_call = "warn"
unnecessary_to_owned = "warn"
map_clone = "warn"
flat_map_identity = "warn"
needless_collect = "warn"
vec_init_then_push = "warn"

len_zero = "allow"
range_plus_one = "allow"
manual_range_contains = "allow"

[[bin]]
name = "lantern"
path = "src/main.rs"
