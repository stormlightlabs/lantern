[package]
name = "lantern-cli"
version = "0.1.0"
edition = "2024"
description = "A modern terminal presentation tool for Markdown decks"
license = "MIT"
repository = "https://github.com/stormlightlabs/lantern"
readme = "../../README.md"
keywords = ["markdown", "slides", "presentations", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25"
owo-colors = "4.2.3"
ratatui = "0.29.0"
ratatui-image = "8.0.2"
pulldown-cmark = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
syntect = "5"
terminal-colorsaurus = "1.0.1"
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[[bin]]
name = "lantern"
path = "src/main.rs"
